version: "3.9"

services:
  api:
    build: ./api
    container_name: diffrun_api
    env_file:
      - ./env/dev.env
    environment:
      - SERVICE_ROLE=api
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app

  worker:
    build: ./api
    container_name: diffrun_worker
    env_file:
      - ./env/dev.env
    environment:
      - SERVICE_ROLE=worker
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./api/app:/app/app

  redis:
    image: redis:7
    container_name: diffrun_redis

  db:
    image: postgres:15
    container_name: diffrun_db
    environment:
      POSTGRES_DB: diffrun
      POSTGRES_USER: diffrun
      POSTGRES_PASSWORD: diffrun
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-07-13T01-46-15Z
    container_name: diffrun_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:RELEASE.2024-07-11T14-46-25Z
    container_name: diffrun_minio_setup
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc mb -p local/books || true &&
       mc anonymous set download local/books &&
       echo 'MinIO setup completed' && sleep 2"

volumes:
  db_data:
  minio_data: